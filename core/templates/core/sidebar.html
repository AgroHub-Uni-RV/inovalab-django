{% load static %}<aside class="sidebar" id="sidebar" aria-label="Menu principal">
  <div class="brand-slot"><a class="sidebar-brand" href="{% url 'core:dashboard' %}" aria-label="InovaLab, Dashboard"><img class="sidebar-logo-icon" src="{% static 'core/assets/logo_icone_rbg.png' %}" alt="InovaLab" width="460" height="473"><img class="sidebar-logo-full" src="{% static 'core/assets/logo_texto_branco.png' %}" alt="InovaLab" width="350" height="130"></a></div>
  <nav class="sidebar-nav">
    {% for item in nav_items %}
    <a class="nav-item{% if item.current %} current{% endif %}" href="{{ item.href }}" aria-label="{{ item.label }}" title="{{ item.label }}"{% if item.current %} aria-current="page"{% endif %}>
      {% include 'core/icon.html' with name=item.icon %}<span class="nav-label">{{ item.label }}</span>
    </a>
    {% endfor %}
  </nav>
  <div class="sidebar-bottom">
    <button class="sidebar-toggle nav-item" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="Expandir menu" title="Expandir menu">
      {% include 'core/icon.html' with name='expand' %}<span class="nav-label">Recolher menu</span>
    </button>
    <form action="{% url 'accounts:logout' %}" method="post">
      {% csrf_token %}<button class="nav-item logout" type="submit" aria-label="Sair" title="Sair">{% include 'core/icon.html' with name='logout' %}<span class="nav-label">Sair</span></button>
    </form>
  </div>
</aside>
<button class="sidebar-backdrop" type="button" aria-label="Fechar menu" tabindex="-1" hidden></button>
