<form method="post" action="{% url 'agenda:review' booking.categoria booking.pk %}" class="booking-review-actions">
  {% csrf_token %}<input type="hidden" name="versao" value="{{ booking.versao }}">
  {% if booking.categoria == 'servico' %}<a class="primary-button" data-task-modal-trigger href="{% url 'tarefas:confirm-service' booking.pk %}" aria-label="Confirmar serviço {{ booking.pk }} criando uma tarefa">Confirmar</a>{% else %}<button type="submit" name="decisao" value="aprovar" aria-label="Aceitar solicitação {{ booking.pk }}">Aceitar</button>{% endif %}
  <button type="submit" name="decisao" value="rejeitar" class="secondary-button" aria-label="Rejeitar solicitação {{ booking.pk }}">Rejeitar</button>
</form>
