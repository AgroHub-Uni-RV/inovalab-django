{% extends 'inovalab_app/agenda/base.html' %}
{% block content %}
<section class="detail-sheet" data-ui-modal-page data-ui-confirmation data-ui-return-url="{% url 'agenda:list' %}"><div class="sheet-content">
<h1>Não foi possível concluir</h1><p class="error" role="alert">{{ message }}</p>
{% if booking %}<p><a href="{{ booking.get_absolute_url }}">Atualizar agendamento</a></p>{% endif %}
{% if remote_request %}<p><a href="{% url 'agenda:requests' %}">Voltar ao gerenciamento</a></p>
{% else %}<p><a href="{% url 'agenda:list' %}">Voltar à agenda</a></p>{% endif %}
</div></section>
{% endblock %}
