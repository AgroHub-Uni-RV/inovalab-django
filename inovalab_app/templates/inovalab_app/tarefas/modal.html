{% load static %}
{% if can_access_panel %}
<dialog id="task-modal" class="task-modal" aria-label="Tarefa" data-board-url="{% url 'tarefas:board' %}"{% if is_business_admin %} data-create-url="{% url 'tarefas:create' %}"{% endif %} data-login-url="{{ inovalab_identity.login_url }}">
  <button type="button" class="task-modal-close" data-task-close aria-label="Fechar tarefa">&times;</button>
  <div class="task-modal-status" role="status" aria-live="polite" hidden></div>
  <div class="task-modal-body"></div>
</dialog>
<script src="{% static 'inovalab_app/tarefas/form.js' %}" defer></script>
<script src="{% static 'inovalab_app/tarefas/task-modal.js' %}" defer></script>
{% endif %}
