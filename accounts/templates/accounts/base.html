{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#29328b">
    <title>{% block title %}InovaLab{% endblock %}</title>
    <link rel="icon" href="data:,">
    <link rel="preload" href="{% static 'inovalab_app/shared/assets/Montserrat.ttf' %}" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="{% static 'inovalab_app/shared/ui.css' %}">
    <link rel="stylesheet" href="{% static 'accounts/style.css' %}">
</head>
<body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <div class="shell">
        <aside class="brand-panel" aria-label="InovaLab">
            <a class="brand" href="{% url 'conteudo:inicio' %}" aria-label="InovaLab, início">
                <img src="{% static 'inovalab_app/shared/assets/logo_texto_branco.png' %}" alt="InovaLab" width="350" height="130">
            </a>
            <div class="brand-copy">
                <span class="eyebrow">Ideias em movimento</span>
                <h1>Um espaço para<br>transformar ideias<br>em soluções.</h1>
                <p>Pessoas, criatividade e inovação.<br>Conectadas no InovaLab.</p>
            </div>
            <span class="brand-footer">Laboratório de inovação</span>
        </aside>
        <main class="main-panel" id="conteudo">
            {% block content %}{% endblock %}
            <footer class="page-footer">InovaLab · Universidade de Rio Verde</footer>
        </main>
    </div>
</body>
</html>
